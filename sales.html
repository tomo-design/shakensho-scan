<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>メカノAI 営業ルーム（社内専用）</title>
<link rel="stylesheet" href="sales.css">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">🏢 メカノAI 営業ルーム <span class="tag">社内専用</span></div>
  <div class="who"><span id="whoami"></span> <button id="btnLogout" class="mini hidden">ログアウト</button></div>
</header>

<!-- ログイン -->
<section id="loginPane" class="pane">
  <h1>営業ルーム</h1>
  <p class="muted">運営（super）アカウントでログインしてください。</p>
  <div class="loginBox">
    <input id="liEmail" type="email" placeholder="メールアドレス" autocomplete="username">
    <input id="liPass" type="password" placeholder="パスワード" autocomplete="current-password">
    <button id="btnLogin" class="primary">ログイン</button>
    <div id="loginMsg" class="err"></div>
  </div>
</section>

<!-- 本体 -->
<main id="appPane" class="hidden">
  <nav class="tabs">
    <button class="tab active" data-tab="team">🤖 AI社員チーム</button>
    <button class="tab" data-tab="leads">📋 見込み客リスト</button>
    <button class="tab" data-tab="camp">🚀 キャンペーン一括生成</button>
  </nav>

  <!-- AI社員チーム -->
  <section id="tab-team" class="tabpane">
    <div class="staffbar" id="staffbar"></div>
    <div class="leadpick">
      <label>対象の見込み客（任意）：</label>
      <select id="leadSelect"><option value="">— 指定なし —</option></select>
    </div>
    <div class="quick" id="quickActions"></div>
    <div class="chat" id="chatLog"></div>
    <div class="composer">
      <textarea id="taskInput" rows="2" placeholder="AI社員に指示を入力（例：この会社に送る初回アプローチメールを書いて）"></textarea>
      <button id="btnSend" class="primary">送信</button>
    </div>
  </section>

  <!-- 見込み客リスト -->
  <section id="tab-leads" class="tabpane hidden">
    <div class="leadhead">
      <button id="btnNewLead" class="primary">＋ 新規追加</button>
      <span id="leadCount" class="muted"></span>
    </div>
    <div id="leadList" class="leadlist"></div>
  </section>

  <!-- キャンペーン一括生成 -->
  <section id="tab-camp" class="tabpane hidden">
  <div class="camphead">
    <p class="muted">登録済みの見込み客に合わせて、営業文をまとめて自動生成します。<b>送信は行いません</b>（確認して手動送信）。</p>
    <div class="camprow">
      <label>チャネル
        <select id="cpChannel">
          <option value="mail">初回アプローチメール</option>
          <option value="follow">フォローメール（デモ後）</option>
          <option value="letter">郵送DM・手紙</option>
          <option value="phone">電話トークスクリプト</option>
          <option value="flyer">チラシ文面</option>
        </select>
      </label>
      <label>訴求の切り口
        <select id="cpAngle">
          <option value="auto">おまかせ（業種で自動選択）</option>
          <option value="shortage">整備士不足・若手育成</option>
          <option value="efficiency">効率化・調べ物/記録の時短</option>
          <option value="gs">GS併設・少人数の生産性</option>
          <option value="logi2024">運送・2024年問題・稼働率</option>
          <option value="dx">電子化・DX・車検証電子化</option>
        </select>
      </label>
    </div>
    <div class="camprow">
      <label>対象の業種
        <select id="cpKind">
          <option value="">すべて</option>
          <option value="整備工場">整備工場</option>
          <option value="運送会社">運送会社</option>
          <option value="ディーラー">ディーラー</option>
          <option value="板金/塗装">板金/塗装</option>
          <option value="その他">その他</option>
        </select>
      </label>
      <label>対象の状況
        <select id="cpStatus">
          <option value="new">未接触（見込み）のみ</option>
          <option value="">すべて</option>
        </select>
      </label>
    </div>
    <div class="campactions">
      <button id="btnRunCamp" class="primary">🚀 一括生成する（<span id="cpTargetN">0</span>社）</button>
      <button id="btnStopCamp" class="mini hidden">中止</button>
      <button id="btnCsv" class="mini hidden">CSV出力</button>
    </div>
    <div id="cpProgress" class="cpprogress hidden"><div id="cpBar"></div></div>
  </div>
    <div id="campResults" class="campresults"></div>
  </section>
</main>

<!-- 見込み客 編集モーダル -->
<div id="leadModal" class="modal hidden">
  <div class="modalbox">
    <h3 id="lmTitle">見込み客</h3>
    <input id="lmCompany" placeholder="会社名 *">
    <div class="row2">
      <select id="lmKind">
        <option value="整備工場">整備工場</option>
        <option value="運送会社">運送会社</option>
        <option value="ディーラー">ディーラー</option>
        <option value="板金/塗装">板金/塗装</option>
        <option value="その他">その他</option>
      </select>
      <select id="lmStatus">
        <option>見込み</option>
        <option>アプローチ中</option>
        <option>商談中</option>
        <option>契約</option>
        <option>見送り</option>
      </select>
    </div>
    <input id="lmContact" placeholder="担当者名">
    <div class="row2">
      <input id="lmPhone" placeholder="電話">
      <input id="lmEmail" placeholder="メール">
    </div>
    <textarea id="lmNote" rows="4" placeholder="メモ（規模・課題・履歴など）"></textarea>
    <div class="modalbtns">
      <button id="lmDelete" class="danger hidden">削除</button>
      <span class="spacer"></span>
      <button id="lmCancel" class="mini">キャンセル</button>
      <button id="lmSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="sales.js"></script>
</body>
</html>
