<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>お問い合わせ｜メカノAI</title>
<style>
  :root{ --bg:#f4f6fa; --card:#fff; --line:#e2e6ee; --ink:#1f2a44; --dim:#6b7486; --brand:#1e5aa8; --amber:#e08a00; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.7; }
  .wrap{ max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  .brand{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; margin-bottom:4px; }
  .lead{ font-size:13px; color:var(--dim); margin:0 0 20px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 18px; box-shadow:0 2px 10px rgba(20,40,80,.04); }
  label{ display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
  label .req{ color:#d33; font-size:11px; margin-left:4px; }
  input,textarea{ width:100%; border:1px solid var(--line); border-radius:9px; padding:11px 12px; font-size:15px; font-family:inherit; background:#fbfcfe; color:var(--ink); }
  input:focus,textarea:focus{ outline:none; border-color:var(--brand); background:#fff; }
  textarea{ min-height:130px; resize:vertical; }
  .hp{ position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .btn{ margin-top:20px; width:100%; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:16px; font-weight:700; padding:14px; cursor:pointer; }
  .btn:disabled{ opacity:.6; cursor:default; }
  .stat{ margin-top:14px; font-size:13.5px; line-height:1.7; }
  .stat.ok{ color:#0f7b45; }
  .stat.ng{ color:#c0392b; }
  .note{ font-size:11.5px; color:var(--dim); margin-top:16px; line-height:1.7; }
  .foot{ margin-top:22px; font-size:11.5px; color:var(--dim); text-align:center; line-height:1.8; }
  .done{ display:none; text-align:center; padding:14px 4px; }
  .done h2{ font-size:17px; margin:0 0 8px; color:#0f7b45; }
  .done p{ font-size:13.5px; color:var(--dim); margin:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">🔧 メカノAI</div>
  <p class="lead">整備工場・運送会社向け 車両整備AIサポート — お問い合わせ・資料請求・無料トライアルのご相談はこちらから。</p>

  <div class="card" id="card">
    <form id="form" novalidate>
      <label>会社名・屋号</label>
      <input type="text" id="company" autocomplete="organization" placeholder="例）〇〇自動車整備工場">

      <label>お名前 <span class="req">必須</span></label>
      <input type="text" id="name" autocomplete="name" required placeholder="例）山田 太郎">

      <label>メールアドレス <span class="req">必須</span></label>
      <input type="email" id="email" autocomplete="email" required placeholder="例）info@example.co.jp">

      <label>電話番号</label>
      <input type="tel" id="phone" autocomplete="tel" placeholder="例）090-1234-5678">

      <label>お問い合わせ内容 <span class="req">必須</span></label>
      <textarea id="message" required placeholder="ご質問・ご相談内容をご記入ください。"></textarea>

      <!-- ハニーポット(bot対策・人間は触れない) -->
      <div class="hp" aria-hidden="true"><label>Website</label><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

      <button type="submit" class="btn" id="send">送信する</button>
      <div class="stat" id="stat"></div>
      <p class="note">ご入力いただいた個人情報は、お問い合わせへの回答および当社サービスのご案内にのみ利用し、第三者に提供しません。送信をもってこの取り扱いに同意いただいたものとします。</p>
    </form>
    <div class="done" id="done">
      <h2>✓ 送信しました</h2>
      <p>お問い合わせありがとうございます。確認メールをお送りしました。担当より2営業日以内にご連絡いたします。</p>
    </div>
  </div>

  <div class="foot">
    メカノAI（MECHANO-AI）／ 運営：Cablueie<br>
    お問い合わせ：cablueie.123@gmail.com
  </div>
</div>

<script>
  var ENDPOINT = "https://asia-northeast1-mecanoai.cloudfunctions.net/submitInquiry";
  var form = document.getElementById("form");
  var send = document.getElementById("send");
  var stat = document.getElementById("stat");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    stat.className = "stat"; stat.textContent = "";
    var payload = {
      company: document.getElementById("company").value,
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      message: document.getElementById("message").value,
      website: document.getElementById("website").value
    };
    if (!payload.name.trim() || !payload.email.trim() || !payload.message.trim()) {
      stat.className = "stat ng"; stat.textContent = "お名前・メール・お問い合わせ内容は必須です。"; return;
    }
    send.disabled = true; send.textContent = "送信中…";
    fetch(ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (res.ok && res.j && res.j.ok) {
        form.style.display = "none";
        document.getElementById("done").style.display = "block";
      } else {
        send.disabled = false; send.textContent = "送信する";
        stat.className = "stat ng";
        stat.textContent = "⚠ " + ((res.j && res.j.error) || "送信に失敗しました。時間をおいて再度お試しください。");
      }
    }).catch(function () {
      send.disabled = false; send.textContent = "送信する";
      stat.className = "stat ng";
      stat.textContent = "⚠ 通信エラーが発生しました。電波の良い場所で再度お試しください。";
    });
  });
</script>
</body>
</html>
